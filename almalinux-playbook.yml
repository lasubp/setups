---
- name: Setup system
  become: true

  tasks:
    # - name: Install distribution GPG keys
    #   ansible.builtin.dnf:
    #     name: distribution-gpg-keys
    #     state: latest

    # Install EPEL repository across RHEL/CentOS versions
    # https://oneuptime.com/blog/post/2026-02-21-ansible-install-epel-repository-rhel-centos/view
    - name: Check if EPEL repo is already configured
      ansible.builtin.stat:
        path: /etc/yum.repos.d/epel.repo
      register: epel_repo

    - name: Import EPEL GPG key
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"
        state: present
      when: not epel_repo.stat.exists

    - name: Install EPEL release package (CentOS/Rocky/Alma)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when:
        - not epel_repo.stat.exists
        - ansible_distribution in ['CentOS', 'Rocky', 'AlmaLinux']

    # On RHEL 8+, also enable CodeReady Builder / CRB (needed for some EPEL packages)
    - name: Enable CRB repository (RHEL / CentOS Stream 9)
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled crb
      when:
        - ansible_distribution_major_version | int >= 9
        - ansible_distribution in ['CentOS', 'Rocky', 'AlmaLinux']
      changed_when: true

    # Optimize DNF configuration for faster package management
    - name: Configure DNF for faster performance
      ansible.builtin.blockinfile:
        path: /etc/dnf/dnf.conf
        block: |
          [main]
          fastestmirror=True
          max_parallel_downloads=10
          best=True
          skip_if_unavailable=True
        
      create: true
      backup: true
      marker : "# {mark} ANSIBLE MANAGED BLOCK - DNF PERFORMANCE OPTIMIZATIONS"

    # Update all packages to the latest version
    - name: Update all packages to the latest version
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_cache: true

    # Install common utilities
    - name: Install common utilities
      ansible.builtin.dnf:
        name:
          - vim
          - git
          - curl
          - wget
          - htop
          - pipx
        state: present

    # install Anssible using pipx
    - name: Install Ansible
      comunity.general.pipx:
        name: ansible
        state: present
        include_dependencies: true

    # Install pywinrm for Ansible Windows support
    - name: Install pywinrm
      comunity.general.pipx:
        name: ansible
        state: inject # inject pywinrm into the ansible pipx environment
        inject_packages:
          - pywinrm

    # # Install ansible from EPEL repository (if not using pipx)
    # - name: Install Ansible from EPEL repository
    #   ansible.builtin.dnf:
    #     name: ansible
    #     state: present
    #  
    # - name: install pywinrm for Ansible Windows support
    #   ansible.builtin.pip:
    #     name: pywinrm>=0.3.0
    #     state: present
      