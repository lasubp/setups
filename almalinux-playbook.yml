    #   ansible.builtin.dnf:
    #     name: ansible
    #     state: absent
    #  
    # - name: Uninstall pywinrm for Ansible Windows support
    #   ansible.builtin.pip:
    #     name: pywinrm>=0.3.0
    #     state: absent
      