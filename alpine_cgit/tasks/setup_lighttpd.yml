---
- name: Install lightttpd
  ansible.builtin.apk:
    name: lighttpd
    state: present

- name: Create Cgit confir for lightttpd
  ansible.builtin.template:
    src: templates/lighttpd_conf.j2
    dest: /etc/lighttpd/cgit.conf
    mode: "0644"
  notify: restart Lighttpd


- name: Include Cgit config to lighttpd config
  ansible.builtin.lineinfile:
    path: /etc/lighttpd/lighttpd.conf
    line: 'include "cgit.conf"'
    state: present
  notify: restart Lighttpd

- name: Check lighttpd config
  ansible.builtin.command: lighttpd -tt -f /etc/lighttpd/lighttpd.conf
  changed_when: false
