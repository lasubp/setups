- name: Setut Cgit on Alpine Linux
  hosts: all
  
  pre_tasks:
    - name: Install Python 3
      ansible.builtin.raw: test -x /usr/bin/python3 || apk add --no-cache python3
      register: bootstrap_python
      changed_when: bootstrap_python.stdout !=""


  tasks:
    - name: Create Git user
      become: true
      roles:
        - managed_users

    - name: Install required packages
      ansible.builtin.apk:
        name:
          - git 
          - cgit
          - fcgiwrap
          - spawn-fcgi
          - lightttpd

    - name: Setup Cgit
      ansible.builtin.copy:
        content:
          virtual-root=/
          scan-path=/var/git/
        dest: /etc/cgitrc
        mode: '0644'

    - name: Create spawn-fcgi service
      ansible.builtin.file:
        state: link
        src: spawn-fcgi
        dest: /etc/init.d/spawn-fcgi.cgit

    - name: Eanble spawn-fcgi logging
      ansible.builtin.lineinfile:
        path: /etc/init.d/spawn-fcgi.cgit
        regrexp: '^(.*\$\{FCGI_PROGRAM\})(?!\s+-f)(.*)$'
        line: '\1 -f\2'
        backrefs: yes

    - name: Create spawn-fcgi.cgit config
      ansible.builtin.copy:
        content:
          FCGI_SOCKET=/run/fcgiwrap/fcgiwrap.sock
          FCGI_PROGRAM=/usr/bin/fcgiwrap
          FCGI_EXTRA_OPTIONS="-M 0660 -U nginx -G nginx"
        dest: /etc/conf.d/spawn-fcgi.cgit
        mode: '0644'
      notify: Start spawn-fcgi.cgit service


    - name: Create Cgit congir for lightttpd
      ansible.builtin.copy:
        src: files/lighttpd/cgit.conf
        dest: /etc/lighttpd/cgit.conf
    
    - name: Include Cgit config to lighttpd config
      ansible.builtin.lineinfile:
        path: /etc/lighttpd/lighttpd.conf
        line: include "cgit.conf"
        state: present

    - name: Restart Lighttpd servise
      ansible.builtin.service:
        name: lirhttpd
        state: restarted
