- name: Setut Cgit on Alpine Linux
  hosts: all
  become: true
  
  pre_tasks:
    - name: Install Python 3
      ansible.builtin.raw: test -x /usr/bin/python3 || apk add --no-cache python3
      register: bootstrap_python
      changed_when: bootstrap_python.stdout !=""


  tasks:
    - name: Create Git user
      roles:
        - managed_users

    - name: Install git and cgit
      ansible.builtin.apk:
        name:
          - git 
          - cgit

    - name: Setup Cgit
      ansible.builtin.copy:
        src: files/cgitrc
        dest: /etc/cgitrc
        mode: '0644'

    - name: Setup Lighttpd
      ansible.builtin.import_task: tasks/setup_lighttpd.yml
      when: web_server == lighttpd

    - name: Setup NGINX and fcgi
      ansible.builtin.import_task: tasks/setup_nginx.yml
      when: web_server == nginx
      
