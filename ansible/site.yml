---
- name: Setup system
  hosts: all
  vars_files:
    - preferences.yml

  tasks:
    - name: Configure DNF
      ansible.builtin.import_tasks: tasks/dnf_conf.yml
      become: true

    - name: Perform system uptade
      ansible.builtin.import_tasks: tasks/dnf_update.yml

    - name: Install distributin GPG keys
      ansible.builtin.import_tasks: tasks/distribution_gpg_keys.yml

    - name: Setup EPEL reposetories
      ansible.builtin.import_tasks: tasks/setup_epel.yml
      become: true
      when: setup_epel

    - name: Setup RPM Fusion
      ansible.builtin.import_tasks: tasks/setup_epel.yml
      become: true
      when: setup_rpmfusion

    - name: Install additional mediacodecs form rpm fuffion
      ansible.builtin.import_tasks: tasks/rpmfusion_media_codecs.yml
      become: true
      when: media

    - name: Replase Fedora Flatpak with Flathub
      ansible.builtin.import_tasks: tasks/replace_fedora_flatpak.yml
      when: falatpak

    - name: Install apps
      ansible.builtin.import_tasks: tasks/install_apps.yml
      become: true

    - name: Install Ansible
      ansible.builtin.import_tasks: tasks/install_ansible.yml
      when: ansible_control_plane
