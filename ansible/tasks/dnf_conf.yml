- name: Optimize DNF configuration for faster package management
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    block: |
      [main]
      max_parallel_downloads=10
      best=True
    create: true
    backup: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DNF PERFORMANCE OPTIMIZATIONS"
  become: true
